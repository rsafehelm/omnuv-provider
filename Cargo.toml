[package]
name = "omnuv-provider"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Omnuv Provider Agent. Executes normalized marketplace intent on a provider runtime."

[dependencies]
omnuv-protocol = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
serde_yaml_ng = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
sha2 = "0.11"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "stream"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }
