[package]
name = "omnuv-provider"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rsafehelm/omnuv-provider"
description = "Omnuv Provider Agent. Executes normalized marketplace intent on a provider runtime."

# The crate keeps the repository's name; the binary takes the `onv` prefix every
# resource on a provider carries. Identity and installed artefact are different
# things: nothing is created on a provider called `omnuv-provider`, and
# everything that is created has to be recognisable as ours at a glance.
[[bin]]
name = "onv-provider"
path = "src/main.rs"

# The Workload Agent, fetched by marketplace machines from Core's /downloads,
# is its own crate, crates/onv-workloadd (omnuv's modular design, A2): as a
# binary of this package its digest moved with this package's dependencies.

# **The provider opening's applier, a binary of its own** (omnuv's modular
# design, A3): it links onv-hostnet and none of the agent, and holds no
# credential, Core's or Proxmox's. The host timer is the other one, in its
# own crate (crates/onv-lease-expire), so it links none of the agent's
# dependencies (no Core client) and its credential is its own.
[[bin]]
name = "onv-opening"
path = "src/bin/onv-opening.rs"

[dependencies]
omnuv-protocol = { git = "https://github.com/rsafehelm/omnuv-protocol", tag = "v0.28.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
anyhow = "1"
serde_yaml_ng = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "stream", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
base64 = "0.22"
sha2 = "0.11"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots", "stream"] }
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# Only for `hyper::ext::ReasonPhrase`: Proxmox puts a refusal's reason in the
# HTTP status line (pve-http-server answers a handler's `die` there), and
# reqwest keeps it only as hyper's response extension. The version reqwest
# already pulls in; no new crate in the build.
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
# Only for `geteuid`: the host timer refuses to run as root, since a file it
# made as root (its own log) is one its unit, running as onv, cannot write.
# The version tokio already pulls in; no new crate in the build.
libc = "0.2"
# A machine's first boot, rendered (the agent workspace, omnuv's modular
# design A1). Moved out with no behaviour change; pinned by tests/linux and
# tests/windows.
onv-generators = { path = "crates/onv-generators" }
# The rest of the split (the agent workspace, omnuv's modular design, A1b):
# the parts that stand outside the agent's cycle, moved with no behaviour
# change. The agent imports each module under the name it always had.
onv-agent-lib = { path = "crates/onv-agent-lib" }
onv-core-link = { path = "crates/onv-core-link" }
onv-driver-proxmox = { path = "crates/onv-driver-proxmox" }
onv-hostnet = { path = "crates/onv-hostnet" }
onv-images = { path = "crates/onv-images" }
onv-scrub = { path = "crates/onv-scrub" }
onv-tunnel = { path = "crates/onv-tunnel" }

# **The agent's workspace** (omnuv's modular design, A1). The root package is
# the agent and stays the only default member, so `cargo build` and the
# package build what they always did. Members are listed, never globbed:
# packaging/workspace-members.txt records them and packaging/check.sh refuses
# any other set.
[workspace]
members = [
    "crates/onv-agent-lib",
    "crates/onv-core-link",
    "crates/onv-driver-proxmox",
    "crates/onv-generators",
    "crates/onv-hostnet",
    "crates/onv-images",
    "crates/onv-lease-expire",
    "crates/onv-scrub",
    "crates/onv-tunnel",
    "crates/onv-workloadd",
]

[dev-dependencies]
tempfile = "3.27.0"
# **The released v0.27.0 contract, for the tests alone** (omnuv's modular
# design, A7): a Core still on v0.27.0 reads what this agent sends with these
# types, so `agent_goldens` holds every message to them. Already in the lock
# for onv-workloadd, which stays on v0.27.0; nothing new is fetched.
v027 = { package = "omnuv-protocol", git = "https://github.com/rsafehelm/omnuv-protocol", tag = "v0.27.0" }
# Fault injection over a simulated network: the tunnel under partitions and
# silence, in simulated time (tunnel.rs, `mod partition`).
turmoil = "0.7.2"
