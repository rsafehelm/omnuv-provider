[package]
name = "onv-agent-lib"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/rsafehelm/omnuv-provider"
description = "The floor every agent crate stands on: resource names, durations, timings, the audit sink."
publish = false

# Moved comments indent quoted output by four spaces, which rustdoc reads as
# Rust to run. They were never doctests in the agent's binary crate.
[lib]
doctest = false

# The versions the agent already locks; this crate adds none to the build.
[dependencies]
omnuv-protocol = { git = "https://github.com/rsafehelm/omnuv-protocol", tag = "v0.27.0" }
onv-generators = { path = "../onv-generators" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
