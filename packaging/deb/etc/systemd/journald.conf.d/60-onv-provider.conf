# **The journal is capped** (omnuv's modular design, A4). journald's default
# holds up to 10% of the filesystem, at most 4 GB, and on a hypervisor that
# is the root filesystem the hypervisor's own API needs: measured at 4 GB on
# a provider whose 69 GB root then filled (omnuv's fixed.md, 30 September
# 2026). The agent writes every audit record to the journal as well.
#
# This caps the whole host's persistent journal, not only the agent's: a
# journal per service would move `journalctl -u onv-provider` behind
# `--namespace`. A provider who wants more edits this file (a conffile) or
# sets a later drop-in; an upgrade does not replace an edited one.
[Journal]
SystemMaxUse=1G
