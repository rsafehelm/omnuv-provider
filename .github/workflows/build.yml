name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --all-targets
      - name: Test
        run: cargo test --locked
      - name: Lints
        run: cargo clippy --locked --all-targets -- -D warnings

  # **The package, not only the crate.** CI built and tested the crate and
  # never built what is installed, so a broken maintainer script or a missing
  # file reached a provider before anything noticed. This builds the .deb the
  # same way a release is built and asserts what is inside it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Maintainer scripts and the build script pass shellcheck
        run: shellcheck packaging/deb/DEBIAN/postinst packaging/deb/DEBIAN/prerm packaging/deb/DEBIAN/postrm packaging/build-deb.sh
      - name: Build the package as a release is built
        run: ./packaging/build-deb.sh
      - name: The package holds the agent, its unit and its maintainer scripts
        run: |
          set -eu
          deb=dist/onv-provider_current_amd64.deb
          dpkg-deb -c "$deb" | grep -q ' ./usr/bin/onv-provider$'
          dpkg-deb -c "$deb" | grep -q ' ./lib/systemd/system/onv-provider.service$'
          for s in postinst prerm postrm; do dpkg-deb -I "$deb" "$s" >/dev/null; done
          test "$(dpkg-deb -f "$deb" Version)" = "$(cat dist/onv-provider_current.version)"
      - name: The Workload Agent is built, static, and starts
        run: |
          set -eu
          file dist/workloadd/onv-workloadd | grep -q 'static'
          dist/workloadd/onv-workloadd --check
